<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Mẫu CNC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #ffffff; color: #333; }
        .section-title { text-align: center; color: #d35400; font-size: 28px; margin-bottom: 30px; font-weight: normal; }
        
        /* Cấu hình lưới hiển thị danh mục */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Thẻ danh mục */
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease-in-out;
            background: #fff;
        }

        /* Hiệu ứng khi rê chuột vào (tương tự ô Hoành Phi trong ảnh) */
        .category-card:hover {
            border-color: #3498db;
            background-color: #f0f8ff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }

        .category-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .category-card span {
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="section-title"> tải về mẫu bạn cần</h1>

    <div class="category-grid">
       <a href="https://drive.google.com/file/d/1ZhffY_GrGpR-0UzoaHwCxzvoa829ny9x/view?usp=sharing" target="_blank" class="category-card">
            <img src="https://via.placeholder.com/80?text=Mam+Tran" alt="Mâm Trần">
            <span>Mâm Trần</span>
        </a>

        <a href="#da-trien" class="category-card">

        <a href="#cau-doi" class="category-card">
